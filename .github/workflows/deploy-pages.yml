name: Publish web app
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish-pages-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos de la web
        run: |
          mkdir -p _site
          cp index.html app.js styles.css supabase-config.js _site/
      - name: Subir la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
